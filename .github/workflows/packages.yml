name: Publish NuGet packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test -c Release
      - run: dotnet pack -c Release -o artifacts -p:Version="${GITHUB_REF_NAME#v}"
      - run: dotnet nuget push 'artifacts/*.nupkg' --source https://nuget.pkg.github.com/dellik95/index.json --api-key "$PACKAGE_TOKEN" --skip-duplicate
        env:
          PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
